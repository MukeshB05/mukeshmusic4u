/* lyrics */
#lyrics-box{position:relative;height:min(52vh,380px);overflow-y:auto;text-align:center;padding:40% 6px;scrollbar-width:none;

<script>
const API_BASE = "https://dreamly5api1.vercel.app/api/".replace(/\/+$/,'');
const PAGE_SIZE = 40;
let results_objects = {}, lastSearch = '', page_index = 1, currentPlaylist = [], currentTrackIndex = -1;
let isPlaying = false, shuffle = false, repeatMode = 0, seeking = false, workingEndpoint = 0, extrasToken = 0, lists = {album:[],sugg:[]};
const $ = id => document.getElementById(id);
const audio = $('player'), grid = $('saavn-results'), loadMoreBtn = $('loadmore');

/* ---------- helpers ---------- */
function decode(s){ const t=document.createElement('textarea'); t.innerHTML=s||''; return t.value; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pickLink(arr,i){
  let out='';
  if(typeof arr==='string') out=arr;
  else if(Array.isArray(arr)&&arr.length){ const it=arr[Math.min(Math.max(i,0),arr.length-1)]; out=(it&&(it.link||it.url))||''; }
  return out.replace(/^http:\/\//,'https://');
}
const bitrateIndex = () => parseInt($('saavn-bitrate').value,10);
function normalize(t){
  const artists = t.primaryArtists || (t.artists&&t.artists.primary&&t.artists.primary.map(a=>a.name).join(', ')) || t.artist || '';
  const album = typeof t.album==='string' ? t.album : (t.album&&t.album.name)||'';
  return {...t, name:decode(t.name||t.title||'Unknown'), primaryArtists:decode(artists), album:decode(album), copyright:decode(t.copyright||t.label||''), duration:Number(t.duration)||0, year:t.year||''};
}
/* FORMAT TIME */
function formatTime(sec){ sec=Math.floor(isFinite(sec)?sec:0); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
const formatDuration = formatTime;
function showLoader(){ grid.innerHTML='<div class="col-span-full text-center"><span class="loader"></span></div>'; }
function showError(m){ grid.innerHTML='<div class="col-span-full text-center text-red-500">'+esc(m)+'</div>'; }
const icon = (el,cls) => el.querySelector('i').className = cls;

/* ---------- API ---------- */
function pickResults(d){
  const c=[d&&d.data&&d.data.results, d&&d.data&&d.data.songs&&d.data.songs.results, d&&d.data&&d.data.songs, d&&d.data, d&&d.results, d&&d.songs, d];
  for(const x of c) if(Array.isArray(x)) return x;
  return [];
}
function endpoints(q,limit,page){
  const e=encodeURIComponent(q);
  return [`${API_BASE}/search/songs?query=${e}&limit=${limit}&page=${page}`,`${API_BASE}/search/songs?q=${e}&limit=${limit}&page=${page}`,
          `${API_BASE}/search?query=${e}&limit=${limit}&page=${page}`,`${API_BASE}/search?q=${e}&limit=${limit}&page=${page}`];
}
async function fetchSearch(q,limit,page){
  const list=endpoints(q,limit,page), order=[workingEndpoint,...list.keys()].filter((v,i,a)=>a.indexOf(v)===i), errs=[];
  for(const i of order){
    try{
      const r=await fetch(list[i]);
      if(!r.ok){ errs.push(r.status+' '+list[i]); continue; }
      const raw=pickResults(await r.json());
      if(raw.length||i===order[order.length-1]){ workingEndpoint=i; return raw; }
    }catch(err){ errs.push(err.message+' '+list[i]); }
  }
  throw new Error('API not reachable. Tried: '+errs.join(' | '));
}
/* FETCH SONG DETAILS */
async function fetchSongDetails(id){
  for(const u of [`${API_BASE}/songs?id=${id}`,`${API_BASE}/songs/${id}`,`${API_BASE}/song?id=${id}`]){
    try{ const r=await fetch(u); if(!r.ok) continue; const a=pickResults(await r.json()); if(a[0]) return normalize(a[0]); }catch(e){}
  }
  return null;
}

/* ---------- genres ---------- */
['Best of 90s - Tamil','Hariharan - Tamil','Best of 2000s - Malayalam','Kalabhavan Mani','Thalapathy Vijay - Tamil','Anirudh - Tamil','Sid Sriram - Tamil','Yuvan Shankar Raja - Tamil','S.A. Rajkumar - Tamil','Vivek - Tamil','Deva - Tamil','A. R. Rahman - Tamil','Shyam Dharman - Malayalam','Unaroo','Vineeth Sreenivasan','Ouseppachan','Gireesh Puthenchery','M. Jayachandran','Vidyasagar - Malayalam','Ivan Torrent - Music'].forEach(g=>{
  const b=document.createElement('button'); b.className='genre-tag'; b.textContent=g; b.onclick=()=>doSaavnSearch(g); $('genre-tags').appendChild(b);
});

/* ---------- cards & lists ---------- */
function createSongCard(t){
  return `<div class="song-card" data-id="${esc(t.id)}"><div class="image-container">
    <img src="${esc(pickLink(t.image,2))}" class="w-full aspect-square object-cover" alt="${esc(t.name)}" loading="lazy">
    <div class="play-overlay"><div class="play-button"><i class="fas fa-play"></i></div></div></div>
    <div class="p-3"><h3 class="font-medium truncate text-sm">${esc(t.name)}</h3>
    <p class="text-xs text-gray-400 truncate">${esc(t.primaryArtists)}</p>
    <p class="text-xs text-gray-500 mt-1">${esc(t.year)} - ${formatTime(t.duration)}</p></div></div>`;
}
function rowHtml(t){
  return `<div class="row" data-id="${esc(t.id)}"><img src="${esc(pickLink(t.image,1)||pickLink(t.image,0))}" alt="">
    <div class="min-w-0 flex-1"><div class="text-sm truncate text-gray-200">${esc(t.name)}</div>
    <div class="text-xs truncate text-gray-400">${esc(t.primaryArtists)}</div></div><span class="text-xs text-gray-500">${formatTime(t.duration)}</span></div>`;
}
function register(arr){ arr.forEach(t=>{ results_objects[t.id]={track:t}; }); }
grid.addEventListener('click',e=>{ const c=e.target.closest('.song-card'); if(c) PlayAudio(c.dataset.id); });
[['album-list','album'],['sugg-list','sugg']].forEach(([id,key])=>{
  $(id).addEventListener('click',e=>{
    const r=e.target.closest('.row'); if(!r) return;
    currentPlaylist=lists[key].slice(); PlayAudio(r.dataset.id);
  });
});
function markActive(){
  const id=currentPlaylist[currentTrackIndex]&&String(currentPlaylist[currentTrackIndex].id);
  document.querySelectorAll('.song-card,.row').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
}

/* ---------- playback ---------- */
function PlayAudio(song_id){
  const entry=results_objects[song_id]; if(!entry) return;
  const track=entry.track, url=pickLink(track.downloadUrl,bitrateIndex());
  if(!url){ $('mp-artist').textContent='No playable link for this song'; return; }
  if(!currentPlaylist.some(t=>String(t.id)===String(song_id))) currentPlaylist=[track];
  currentTrackIndex=currentPlaylist.findIndex(t=>String(t.id)===String(song_id));
  updateSongInfo(track);
  audio.src=url;
  audio.play().catch(err=>{ console.error(err); setIsPlaying(false); $('mp-artist').textContent='Could not play. Try another song or lower bitrate.'; });
  updateMediaSession(track); markActive(); refreshLike();
  if($('full-player').classList.contains('open')){ loadExtras(track); ensureLyrics(); }
}
/* PLAY / PAUSE */
function togglePlay(){ if(!audio.src) return; audio.paused ? audio.play().catch(console.error) : audio.pause(); }
function setIsPlaying(p){ isPlaying=p; const c=p?'fas fa-pause':'fas fa-play'; icon($('mp-play'),c); icon($('fp-play'),c); }
function prevSong(){
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  if(currentTrackIndex>0) PlayAudio(currentPlaylist[currentTrackIndex-1].id);
}
function nextSong(){
  const n=currentPlaylist.length; if(currentTrackIndex<0||!n) return;
  if(shuffle&&n>1){
    let i; do{ i=Math.floor(Math.random()*n); }while(i===currentTrackIndex);
    PlayAudio(currentPlaylist[i].id);
  }else if(currentTrackIndex<n-1) PlayAudio(currentPlaylist[currentTrackIndex+1].id);
  else if(repeatMode===1) PlayAudio(currentPlaylist[0].id);
}
/* SHUFFLE */
function toggleShuffle(){
  shuffle=!shuffle; const b=$('fp-shuffle');
  b.classList.toggle('on',shuffle); b.title=shuffle?'Shuffle on':'Shuffle off';
}
/* REPEAT */
function toggleRepeatMode(){
  repeatMode=(repeatMode+1)%3;                       // 0 off, 1 repeat all, 2 repeat one
  const b=$('fp-repeat');
  b.classList.toggle('on',repeatMode>0);
  $('rep-one').style.display=repeatMode===2?'block':'none';
  b.title=['Repeat off','Repeat all','Repeat one'][repeatMode];
}
/* COVER IMAGE RGB BACKGROUND */
function coverColor(src){
  const fp=$('full-player'); if(!src){ fp.style.removeProperty('--bg1'); return; }
  const im=new Image(); im.crossOrigin='anonymous';
  im.onload=()=>{
    try{
      const c=document.createElement('canvas'); c.width=c.height=16;
      const x=c.getContext('2d'); x.drawImage(im,0,0,16,16);
      const d=x.getImageData(0,0,16,16).data; let r=0,g=0,b=0,n=0;
      for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
      const k=.65; fp.style.setProperty('--bg1',`rgb(${Math.round(r/n*k)},${Math.round(g/n*k)},${Math.round(b/n*k)})`);
    }catch(e){ fp.style.removeProperty('--bg1'); }   // CORS blocked: blurred cover still colours the background
  };
  im.onerror=()=>fp.style.removeProperty('--bg1');
  im.src=src;
}
/* SONG INFO */
function updateSongInfo(t){
  const img=pickLink(t.image,2)||pickLink(t.image,0);
  $('mp-name').textContent=$('fp-name').textContent=t.name;
  $('mp-artist').textContent=$('fp-artist').textContent=t.primaryArtists;
  $('mp-img').src=$('fp-art').src=img||$('mp-img').src;
  $('fp-meta').textContent=[t.album,t.year,t.language].filter(Boolean).join(' • ');
  $('fp-bg').style.backgroundImage=img?`url("${img}")`:'none';
  coverColor(img);
  document.title=t.name+' - MUKESH MUSIC 4U';
}

/* ---------- AUDIO EVENTS ---------- */
audio.addEventListener('play',()=>{ setIsPlaying(true); if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; });
audio.addEventListener('pause',()=>{ setIsPlaying(false); if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; });
audio.addEventListener('waiting',()=>icon($('fp-play'),'fas fa-spinner fa-spin'));
audio.addEventListener('playing',()=>setIsPlaying(true));
audio.addEventListener('loadedmetadata',()=>{ $('fp-dur').textContent=formatTime(audio.duration); updatePosition(); });
audio.addEventListener('timeupdate',()=>{
  syncLyrics(audio.currentTime);
  const d=audio.duration; if(!d||!isFinite(d)) return;

  const h=(a,f)=>{ try{ navigator.mediaSession.setActionHandler(a,f); }catch(e){} };

const appleGet=async(path,sig)=>{

function parseLRC(txt){
  const out=[];
  String(txt||'').split(/\r?\n/).forEach(l=>{
    const st=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text=l.replace(/\[[^\]]*\]/g,'').replace(/<[^>]*>/g,'').trim();

function ttTime(s){

// Apple Music lyrics come as TTML (XML): one <p begin="..."> per line, optional <span> per word/syllable
function parseTTML(x){

  const lines=[...doc.getElementsByTagName('p')]
    .map(p=>({t:ttTime(p.getAttribute('begin')),text:(p.textContent||'').replace(/\s+/g,' ').trim()}))
    .filter(l=>l.text&&l.t!=null&&!isNaN(l.t));

}
function parseLyrics(d){
  if(!d) return null;

  if(d.ttml) return parseTTML(d.ttml);
  if(d.data&&d.data[0]&&d.data[0].attributes&&d.data[0].attributes.ttml) return parseTTML(d.data[0].attributes.ttml);
  if(typeof d==='string') return /\[\d+:\d+/.test(d)?{lines:parseLRC(d),synced:true}:{lines:d.split(/\r?\n/).map(t=>({t:0,text:t})),synced:false};
  if(d.syncedLyrics) return {lines:parseLRC(d.syncedLyrics),synced:true};
  const arr=Array.isArray(d)?d:d.content||d.lyrics||d.lines||d.data;
  if(typeof arr==='string') return parseLyrics(arr);
  if(Array.isArray(arr)&&arr.length){
    const lines=arr.map(x=>{
      const raw=x.timestamp??x.startTime??x.start??x.time??x.startTimeMs;
      const text=x.text??x.words??x.line??(x.syllabus&&x.syllabus.map(s=>s.text).join(''))??'';
      return {t:raw==null?null:Number(raw)/1000,text:String(text).trim()};
    }).filter(x=>x.text);
    if(lines.length&&lines.every(x=>x.t!=null&&!isNaN(x.t))) return {lines,synced:true};
  }
  if(d.plainLyrics) return {lines:d.plainLyrics.split(/\r?\n/).map(t=>({t:0,text:t})),synced:false};

}
async function findLyrics(t){

  const m={title:clean(t.name),artist:clean((t.primaryArtists||'').split(',')[0]),
           album:clean(t.album),dur:Math.round(t.duration||audio.duration||0)||''};
  // every source runs in parallel with its own 12s timeout
  const jobs=LY_SOURCES.map(s=>{
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),12000);
    return s.get(m,ctl.signal).then(parseLyrics)
      .then(p=>p&&p.lines.length?{...p,source:s.source,href:s.href}:null)
      .catch(e=>{ lyErr=e.name==='AbortError'?'Timed out':String(e.message||e); return null; }).finally(()=>clearTimeout(to));
  });

function renderLyrics(r){

  $('lyrics-src').innerHTML=`Lyrics: <a href="${r.href}" target="_blank" rel="noopener" class="underline">${r.source}</a>${r.synced?'':' (not synced)'}`;

async function loadLyrics(t){

/* ---------- DOWNLOAD WITH TAGS (cover, title, album, artist, year, copyright) ---------- */
const u32=n=>new Uint8Array([n>>>24&255,n>>>16&255,n>>>8&255,n&255]);
const cat=(...a)=>{ let l=0; a.forEach(x=>l+=x.length); const o=new Uint8Array(l); let p=0; a.forEach(x=>{o.set(x,p);p+=x.length;}); return o; };
const str4=t=>new Uint8Array([...t].map(c=>c.charCodeAt(0)&255));
const utf16=t=>{ const o=new Uint8Array(2+t.length*2); o[0]=255; o[1]=254; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); o[2+i*2]=c&255; o[3+i*2]=c>>8; } return o; };
const id3f=(id,body)=>cat(str4(id),u32(body.length),new Uint8Array(2),body);
const id3t=(id,t)=>id3f(id,cat(new Uint8Array([1]),utf16(t)));
function tagMP3(buf,g){
  let u=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  if(u[0]===73&&u[1]===68&&u[2]===51) u=u.subarray(10+(((u[6]&127)<<21)|((u[7]&127)<<14)|((u[8]&127)<<7)|(u[9]&127)));
  const fr=[id3t('TIT2',g.title),id3t('TPE1',g.artist)];
  if(g.album) fr.push(id3t('TALB',g.album)); if(g.year) fr.push(id3t('TYER',g.year)); if(g.copy) fr.push(id3t('TCOP',g.copy));
  if(g.cover) fr.push(id3f('APIC',cat(new Uint8Array([0]),str4(g.cover.mime),new Uint8Array([0,3,0]),g.cover.data)));

async function toMP3(buf,kbps,onPct){
  if(typeof lamejs==='undefined') throw new Error('MP3 encoder (lamejs) did not load');
  const AC=window.AudioContext||window.webkitAudioContext, ctx=new AC();
  let ab; try{ ab=await ctx.decodeAudioData(buf.slice(0)); } finally{ if(ctx.close) ctx.close(); }
  const ch=Math.min(ab.numberOfChannels,2), enc=new lamejs.Mp3Encoder(ch,ab.sampleRate,kbps);
  const i16=f=>{ const o=new Int16Array(f.length); for(let i=0;i<f.length;i++){ const x=Math.max(-1,Math.min(1,f[i])); o[i]=x<0?x*32768:x*32767; } return o; };
  const L=i16(ab.getChannelData(0)), R=ch>1?i16(ab.getChannelData(1)):null, out=[], S=1152*20;
  for(let i=0,n=0;i<L.length;i+=S,n++){
    const d=R?enc.encodeBuffer(L.subarray(i,i+S),R.subarray(i,i+S)):enc.encodeBuffer(L.subarray(i,i+S));
    if(d.length) out.push(new Uint8Array(d));
    if(n%10===0){ onPct(Math.round(i/L.length*100)); await new Promise(res=>setTimeout(res)); }
  }
  const e=enc.flush(); if(e.length) out.push(new Uint8Array(e));
  return cat(...out);
}
async function fetchCover(t){
  const arr=Array.isArray(t.image)?t.image:[]; let src=pickLink(arr,arr.length-1);
  if(!src) return null;

    try{ const r=await fetch(u); if(!r.ok) continue; const d=new Uint8Array(await r.arrayBuffer());
      return {data:d,mime:(d[0]===137&&d[1]===80)?'image/png':'image/jpeg'}; }catch(e){}

}
async function downloadSong(){

loadMoreBtn.addEventListener('click',()=>{
  const old=loadMoreBtn.textContent; loadMoreBtn.textContent='Loading...'; loadMoreBtn.disabled=true;
  doSaavnSearch(lastSearch,true,true).finally(()=>{ loadMoreBtn.textContent=old; loadMoreBtn.disabled=false; });
});
$('saavn-search-trigger').addEventListener('click',SaavnSearch);
$('saavn-search-box').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); SaavnSearch(); } });

/* ---------- shortcuts / bitrate ---------- */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowLeft'&&e.ctrlKey) prevSong();
  else if(e.code==='ArrowRight'&&e.ctrlKey) nextSong();
});
$('saavn-bitrate').addEventListener('change',()=>{
  const t=currentSong(); if(!t) return;
  const pos=audio.currentTime, was=!audio.paused, u=pickLink(t.downloadUrl,bitrateIndex()); if(!u) return;
  audio.src=u;
  audio.addEventListener('loadedmetadata',function f(){ audio.currentTime=pos; audio.removeEventListener('loadedmetadata',f); });
  if(was) audio.play().catch(console.error);
});
window.addEventListener('load',()=>doSaavnSearch('tamil',true));
</script>
